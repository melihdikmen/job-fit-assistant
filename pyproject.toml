[project]
name = "job-fit-assistant"
version = "0.1.0"
description = "Decides APPLY / PREPARE / SKIP for a job posting and a CV, and benchmarks LLMs on that task."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_fit"

[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown files hold documentation snippets, not project code; leave them as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (unused imports, undefined names)
    "I",  # import sorting
    "UP", # modern Python syntax
    "B",  # bugbear (likely bugs)
    "D",  # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
